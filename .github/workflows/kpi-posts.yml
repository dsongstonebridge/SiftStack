# Daily KPI Engine post + sheet fill (weekdays from 6:30 PM Tulsa time, once per day) and the weekly
# sheet-bot post (Fridays). Runs in GitHub's cloud, so the PC can be off.
# Secrets (Settings > Secrets and variables > Actions):
#   DATASIFT_API_KEY, KPI_SLACK_WEBHOOK_URL, KPI_SPREADSHEET_ID, KPI_SERVICE_ACCOUNT_JSON
name: KPI posts

on:
  schedule:
    # GitHub often starts timed runs late (sometimes by an hour+) or drops one.
    # So we knock every hour from 6:30 PM to ~10:30 PM Tulsa time; the first run
    # that gets through posts, and the rest see "already posted today" and stop.
    - cron: "30 23 * * *"
    - cron: "30 0 * * *"
    - cron: "30 1 * * *"
    - cron: "30 2 * * *"
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      what:
        description: "What to run"
        type: choice
        options: [daily, weekly-sheet-post, both]
        default: daily

concurrency: kpi-posts

permissions:
  contents: read
  actions: read

jobs:
  kpi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
      DATASIFT_API_KEY: ${{ secrets.DATASIFT_API_KEY }}
      KPI_SLACK_WEBHOOK_URL: ${{ secrets.KPI_SLACK_WEBHOOK_URL }}
      SMRTPHONE_STATE: ${{ secrets.SMRTPHONE_STATE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decide what runs (scheduled - weekdays from 6:30 PM Tulsa time, once a day)
        id: gate
        env:
          WHAT: ${{ github.event.inputs.what }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime, json, os, urllib.request
          from zoneinfo import ZoneInfo
          tz = ZoneInfo("America/Chicago")
          now = datetime.datetime.now(tz)
          manual = os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch"
          what = os.environ.get("WHAT") or "daily"
          on_time = (now.hour, now.minute) >= (18, 25)
          daily = (manual and what in ("daily", "both")) or (not manual and on_time and now.weekday() < 5)
          weekly = (manual and what in ("weekly-sheet-post", "both")) or (not manual and on_time and now.weekday() == 4)

          def already_posted(step_name):
              # Look at this workflow's earlier runs today (manual or scheduled) and
              # see whether that post step actually succeeded.
              repo, me = os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_RUN_ID"]
              hdr = {"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"}
              def get(url):
                  return json.load(urllib.request.urlopen(urllib.request.Request(url, headers=hdr), timeout=30))
              midnight = now.replace(hour=0, minute=0, second=0, microsecond=0)
              runs = get(f"https://api.github.com/repos/{repo}/actions/workflows/kpi-posts.yml/runs?per_page=30")["workflow_runs"]
              for r in runs:
                  started = datetime.datetime.fromisoformat(r["created_at"].replace("Z", "+00:00")).astimezone(tz)
                  if str(r["id"]) == me or started < midnight:
                      continue
                  for j in get(r["jobs_url"])["jobs"]:
                      for st in j.get("steps", []):
                          if st["name"].startswith(step_name) and st.get("conclusion") == "success":
                              return True
              return False

          if not manual:
              try:
                  if daily and already_posted("Post the daily KPI Engine summary"):
                      daily = False
                  if weekly and already_posted("Post the weekly sheet summary"):
                      weekly = False
              except Exception as ex:
                  import sys; print(f"could not check earlier runs ({ex}); posting anyway", file=sys.stderr)
          print(f"daily={'true' if daily else 'false'}")
          print(f"weekly={'true' if weekly else 'false'}")
          PY

      - name: Install
        if: steps.gate.outputs.daily == 'true' || steps.gate.outputs.weekly == 'true'
        run: pip install gspread google-auth requests tzdata

      - name: Write sheet credentials (from encrypted secrets; never committed)
        if: steps.gate.outputs.daily == 'true' || steps.gate.outputs.weekly == 'true'
        env:
          SA_JSON: ${{ secrets.KPI_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.KPI_SPREADSHEET_ID }}
        run: |
          missing=""
          [ -z "$DATASIFT_API_KEY" ] && missing="$missing DATASIFT_API_KEY"
          [ -z "$KPI_SLACK_WEBHOOK_URL" ] && missing="$missing KPI_SLACK_WEBHOOK_URL"
          [ -z "$SHEET_ID" ] && missing="$missing KPI_SPREADSHEET_ID"
          [ -z "$SA_JSON" ] && missing="$missing KPI_SERVICE_ACCOUNT_JSON"
          if [ -n "$missing" ]; then echo "::warning::These repo secrets are empty or misnamed:$missing"; fi
          # strip a Windows byte-order mark / stray whitespace, then check it is real JSON
          printf '%s' "$SA_JSON" | python -c "import sys,json; t=sys.stdin.read().lstrip('\ufeff').strip(); json.loads(t) if t else None; open('kpi-bot/service_account.json','w').write(t)" \
            || echo "::warning::KPI_SERVICE_ACCOUNT_JSON is not valid JSON - paste the whole service_account.json file, including the { } braces"
          printf 'KPI_SPREADSHEET_ID=%s\nKPI_SLACK_WEBHOOK_URL=%s\nKPI_SERVICE_ACCOUNT_FILE=service_account.json\nKPI_COMPANY_NAME=Tulsa Homebuyers\n' \
            "$SHEET_ID" "$KPI_SLACK_WEBHOOK_URL" > kpi-bot/.env

      - name: Fill the KPI sheet from DataSift
        if: steps.gate.outputs.daily == 'true'
        working-directory: kpi-engine
        run: python fill_sheet.py
        continue-on-error: true

      - name: Post the daily KPI Engine summary
        if: steps.gate.outputs.daily == 'true'
        working-directory: kpi-engine
        run: python pull_kpis.py --days 1 --slack auto

      - name: Post the weekly sheet summary (Fridays)
        if: steps.gate.outputs.weekly == 'true'
        working-directory: kpi-bot
        run: python kpi_slack_bot.py

